<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dr. Sana PT Clinic - Online Appointment</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #e3f2fd, #ffffff);
            margin:0;
            padding:0;
        }
        header{
            background-color:#0d47a1;
            color:white;
            text-align:center;
            padding:20px;
        }
        .container{
            width:50%;
            margin:30px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }
        h2{
            text-align:center;
            color:#0d47a1;
        }
        label{
            font-weight:bold;
        }
        input, select, textarea{
            width:100%;
            padding:10px;
            margin:8px 0 15px 0;
            border-radius:5px;
            border:1px solid #ccc;
        }
        button{
            background:#0d47a1;
            color:white;
            padding:12px;
            border:none;
            width:100%;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }
        button:hover{
            background:#1565c0;
        }
        footer{
            text-align:center;
            padding:15px;
            margin-top:20px;
            background:#0d47a1;
            color:white;
        }
    </style>
</head>
<body>

<header>
    <h1>Dr. Sana PT Clinic</h1>
    <p>Professional Physiotherapy Care</p>
</header>

<div class="container">
    <h2>Online Appointment Form</h2>

    <form action="https://formspree.io/f/mdabyydp" method="POST">
  
  <label>Full Name:</label>
  <input type="text" name="name" placeholder="Enter your name" required>

  <label>Email:</label>
  <input type="email" name="email" placeholder="Enter your email" required>

  <label>Phone Number:</label>
  <input type="text" name="phone" placeholder="Enter your phone number" required>

  <label>Appointment Date:</label>
  <input type="date" name="date" required>

  <label>Message:</label>
  <textarea name="message" placeholder="Write your problem"></textarea>

  <button type="submit">Book Appointment</button>

</form>

</div>

<footer>
    © 2026 Dr. Sana PT Clinic | Contact: 03XXXXXXXXX
</footer>

</body>
</html>
